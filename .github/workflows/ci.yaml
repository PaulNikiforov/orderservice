name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

# Cancel in-progress runs for the same branch/PR on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal global permissions; docker job overrides with packages: write
permissions:
  contents: read

jobs:
  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 keyed on pom.xml hash

      - name: Run tests
        # No DB_URL / KAFKA_BOOTSTRAP_SERVERS env vars needed:
        # Testcontainers spins up PostgreSQL + Kafka via @ServiceConnection.
        # Docker socket is available on ubuntu-24.04 by default.
        run: ./mvnw test --no-transfer-progress

      - name: Upload test reports
        if: always()            # upload even on failure so failures are diagnosable
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  # ── Docker image ─────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20         # multi-stage Maven build inside Docker takes longer
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write           # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # github.repository = "owner/repo" → ghcr.io/owner/repo:tag (no /orderservice suffix)
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # GHA layer cache — speeds up repeated builds when only src/ changes
          cache-from: type=gha
          cache-to: type=gha,mode=max
