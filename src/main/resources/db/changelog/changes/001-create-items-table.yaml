databaseChangeLog:
  - changeSet:
      id: 001-create-items-sequence
      author: dev
      changes:
        - createSequence:
            sequenceName: items_id_seq
            startValue: 1
            incrementBy: 50

  - changeSet:
      id: 001-create-items-table
      author: dev
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
