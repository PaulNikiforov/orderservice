databaseChangeLog:
  - changeSet:
      id: 009-create-order-outbox-events-table
      author: dev
      changes:
        - createTable:
            tableName: order_outbox_events
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: published
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: order_outbox_events

  - changeSet:
      id: 009-add-order-outbox-unpublished-index
      author: dev
      changes:
        - sql:
            sql: CREATE INDEX idx_order_outbox_unpublished ON order_outbox_events (published) WHERE published = FALSE
      rollback:
        - sql:
            sql: DROP INDEX idx_order_outbox_unpublished
